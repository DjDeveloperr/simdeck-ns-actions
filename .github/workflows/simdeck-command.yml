name: SimDeck Command

on:
  issue_comment:
    types:
      - created

permissions:
  actions: write
  contents: read
  issues: write
  pull-requests: read

jobs:
  dispatch-ios:
    name: Dispatch iOS provider
    if: >-
      ${{
        github.event.issue.pull_request &&
        contains(github.event.comment.body, 'simdeck run ios')
      }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.issue.number }}
      SIMDECK_COMMENT_BODY: ${{ github.event.comment.body }}

    steps:
      - name: Create status comment
        id: status
        run: |
          set -euo pipefail
          status_body="Starting a SimDeck iOS session for this pull request. I will update this comment with the tunnel URL when it is ready."
          comment_id="$(gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" -f body="${status_body}" --jq '.id')"
          echo "comment_id=${comment_id}" >> "${GITHUB_OUTPUT}"

      - name: Dispatch provider workflow
        run: |
          set -euo pipefail
          gh workflow run "SimDeck iOS Comment" \
            --repo "${REPO}" \
            -f "pr_number=${PR_NUMBER}" \
            -f "command=${SIMDECK_COMMENT_BODY}" \
            -f "status_comment_id=${{ steps.status.outputs.comment_id }}"
